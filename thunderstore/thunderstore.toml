[config]
schemaVersion = "0.0.1"

[package]
namespace = "Ab5oluteZer0"
name = "AutoWaypoints"
# Nadpisywane numerem z tagu wydania przy publikacji (workflow thunderstore.yml).
versionNumber = "1.0.0"
description = "Automatic map pins for ores, berries, mushrooms, crops, beehives, dungeons, structures, portals and ships you walk past - with icons, names and an in-game settings window on the map."
websiteUrl = "https://github.com/Ab5oluteZer0/valheim-auto-waypoints"
containsNsfwContent = false

[package.dependencies]
"denikson-BepInExPack_Valheim" = "5.4.2351"
"ValheimModding-Jotunn" = "2.30.2"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./dist"
target = ""

[publish]
repository = "https://thunderstore.io"
communities = ["valheim"]

[publish.categories]
# "ai-generated": zasada Thunderstore dla paczek, ktorych kod powstal z pomoca AI.
valheim = ["mods", "utility", "client-side", "ai-generated"]
